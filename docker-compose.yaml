services:
  qdrant:
    # Version floor: the sparse IDF modifier requires qdrant >= 1.10, so this
    # pin must never move below that. v1.19.0 is the current stable release.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"   # REST + dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # the image ships no curl/wget; bash TCP probe against the REST port.
      # Without this, `docker compose up --wait` returns at "running", not
      # "ready", and immediate curl/test steps can race a slow start.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 30

  reranker:
    # Self-hosted bge-reranker-v2-m3 (multilingual cross-encoder) served by
    # llama.cpp. Its /v1/rerank is Jina/Cohere-compatible, so .apprc.yaml uses
    # reranker.provider: cohere_style with base_url http://localhost:8081/v1.
    # NOTE: `:server` is a moving tag; pin a `server-b<build>` tag if a llama.cpp
    # update ever changes behavior.
    # Each query+parent pair is one encoder pass and must fit in --ubatch-size
    # or the request 500s ("input is too large to process"). 2048 covers
    # parent_tokens: 1200 with headroom; raise it if parent_tokens grows.
    image: ghcr.io/ggml-org/llama.cpp:server
    command: >
      -hf gpustack/bge-reranker-v2-m3-GGUF:Q8_0
      --reranking
      --host 0.0.0.0 --port 8080
      --ctx-size 8192
      --batch-size 2048 --ubatch-size 2048
    ports:
      - "8081:8080"
    volumes:
      # -hf downloads the ~600MB GGUF here on first start; cached afterwards.
      - llama_cache:/root/.cache/llama.cpp
    healthcheck:
      # the port opens only after the model is downloaded and loaded, so a TCP
      # probe is a real readiness signal. Generous retries: the first
      # `up --wait` sits through the one-time download.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 300

volumes:
  qdrant_storage:
  llama_cache:
